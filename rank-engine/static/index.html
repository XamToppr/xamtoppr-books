<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XamToppr — Master Score & Rank Calculator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            xamnavy: { 50: '#f4f6fb', 100: '#e8edf6', 500: '#2b4c80', 800: '#111b33', 900: '#0b1326', 950: '#060a16' },
            toppr: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c', 800: '#9f1239' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

  <!-- Header Bar -->
  <header class="bg-xamnavy-900 text-white border-b border-slate-800 sticky top-0 z-50 shadow-md no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="https://xamtoppr.com" target="_blank" class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-toppr-600 to-rose-400 flex items-center justify-center font-heading font-black text-lg text-white shadow-md">X</div>
        <div class="flex flex-col">
          <span class="font-heading font-extrabold text-lg leading-tight text-white">Xam<span class="text-toppr-500">Toppr</span></span>
          <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Rank Calculator</span>
        </div>
      </a>
      <div class="flex items-center space-x-3">
        <button type="button" onclick="loadDemoGroupD()" class="px-3.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-medium text-xs border border-white/15 transition flex items-center space-x-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
          <span>Load Demo Result</span>
        </button>
      </div>
    </div>
  </header>

  <div class="bg-gradient-to-r from-toppr-700 via-rose-600 to-amber-600 text-white text-xs py-2 px-4 text-center font-bold tracking-wide shadow-sm no-print">
    🔥 <strong>RRB Group D & SSC 2026-27 Response Sheets:</strong> Instant official scoring & rank prediction!
  </div>

  <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8 space-y-6">

    <!-- Input Card -->
    <section id="input-card" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-7 no-print transition-all">
      <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
        <div>
          <h1 class="text-lg sm:text-2xl font-heading font-black text-xamnavy-900">DigiALM Score &amp; Rank Calculator</h1>
          <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Calculate your exam score directly from your DigiALM response sheet.</p>
        </div>
        <span class="inline-flex items-center space-x-1.5 bg-emerald-50 text-emerald-700 text-[11px] font-bold px-2.5 py-1 rounded-full border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Fastest Engine</span>
        </span>
      </div>

      <!-- Mode Tabs -->
      <div class="flex border-b border-slate-200 mb-5 text-xs font-bold">
        <button id="tab-btn-url" type="button" onclick="switchTab('url')" class="pb-2.5 px-4 border-b-2 border-toppr-600 text-toppr-600 flex items-center space-x-1.5">
          <i data-lucide="link" class="w-3.5 h-3.5"></i>
          <span>Response Sheet URL</span>
        </button>
        <button id="tab-btn-html" type="button" onclick="switchTab('html')" class="pb-2.5 px-4 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5">
          <i data-lucide="file-code" class="w-3.5 h-3.5"></i>
          <span>Paste HTML Code (Offline)</span>
        </button>
      </div>

      <!-- URL Input Form -->
      <div id="panel-url" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">DigiALM Response Sheet URL *</label>
          <div class="relative">
            <input type="url" id="sheet-url" placeholder="https://rrb.digialm.com/.../AssessmentQPHTMLMode1/...html" class="w-full pl-3.5 pr-24 py-3 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm font-medium focus:ring-2 focus:ring-toppr-500 outline-none">
            <button type="button" onclick="pasteClipboard()" class="absolute right-2 top-2 px-2.5 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold flex items-center space-x-1">
              <i data-lucide="clipboard" class="w-3 h-3"></i>
              <span>Paste</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Offline HTML Input Form -->
      <div id="panel-html" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Response Sheet HTML Source Code *</label>
          <textarea id="sheet-html" rows="5" placeholder="Open response sheet in browser, press Ctrl+U, copy all code and paste here..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono focus:ring-2 focus:ring-toppr-500 outline-none"></textarea>
        </div>
      </div>

      <!-- Demographic Filters -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 mt-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Target Exam</label>
          <select id="exam-select" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-medium">
            <option value="AUTO" selected>⚡ Auto Detect from Sheet</option>
            <option value="RRB_GROUP_D">RRB Group D (CBT 1)</option>
            <option value="SSC_CGL_TIER1">SSC CGL Tier-I</option>
            <option value="SSC_CHSL_TIER1">SSC CHSL Tier-I</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Category</label>
          <select id="user-category" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-medium">
            <option value="UR">UR (General)</option>
            <option value="OBC">OBC</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Zone / State</label>
          <select id="user-zone-state" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-medium">
            <option value="Bhopal">Bhopal</option>
            <option value="Patna">Patna</option>
            <option value="Mumbai">Mumbai</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Gender</label>
          <select id="user-gender" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-medium">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
      </div>

      <!-- Submit Actions -->
      <div class="mt-6 flex flex-wrap items-center gap-3">
        <button type="button" id="btn-calc" onclick="handleCalculate()" class="px-6 py-3 rounded-xl bg-toppr-600 hover:bg-toppr-700 text-white font-heading font-extrabold text-xs sm:text-sm shadow-md transition flex items-center space-x-2">
          <i data-lucide="calculator" class="w-4 h-4"></i>
          <span>Calculate Score</span>
        </button>
        <button type="button" onclick="clearForm()" class="px-4 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition">Clear</button>
        <span id="calc-status" class="text-xs font-semibold text-slate-500"></span>
      </div>
    </section>

    <!-- RESULT CONTAINER -->
    <div id="result-container" class="space-y-6 hidden">
      <div class="bg-gradient-to-br from-xamnavy-900 to-xamnavy-950 text-white rounded-2xl p-6 shadow-lg">
        <h2 id="res-name" class="text-2xl font-black">Candidate Name</h2>
        <p id="res-roll" class="text-xs text-slate-400 font-mono mt-1">Roll No: --</p>
        <div class="mt-4 flex items-center space-x-4">
          <div>
            <span class="text-xs text-slate-400 uppercase">Final Raw Score</span>
            <span id="res-score" class="text-3xl font-black text-toppr-500 block">0.0</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });

    function switchTab(mode) {
      const btnUrl = document.getElementById('tab-btn-url');
      const btnHtml = document.getElementById('tab-btn-html');
      const panelUrl = document.getElementById('panel-url');
      const panelHtml = document.getElementById('panel-html');

      if (mode === 'url') {
        btnUrl.className = "pb-2.5 px-4 border-b-2 border-toppr-600 text-toppr-600 flex items-center space-x-1.5";
        btnHtml.className = "pb-2.5 px-4 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5";
        panelUrl.classList.remove('hidden');
        panelHtml.classList.add('hidden');
      } else {
        btnHtml.className = "pb-2.5 px-4 border-b-2 border-toppr-600 text-toppr-600 flex items-center space-x-1.5";
        btnUrl.className = "pb-2.5 px-4 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5";
        panelHtml.classList.remove('hidden');
        panelUrl.classList.add('hidden');
      }
    }

    function pasteClipboard() {
      navigator.clipboard.readText().then(text => {
        document.getElementById('sheet-url').value = text;
      }).catch(() => {});
    }

    function clearForm() {
      document.getElementById('sheet-url').value = '';
      document.getElementById('sheet-html').value = '';
      document.getElementById('result-container').classList.add('hidden');
      document.getElementById('calc-status').textContent = '';
    }

    async function handleCalculate() {
      const urlVal = document.getElementById('sheet-url').value.trim();
      const htmlVal = document.getElementById('sheet-html').value.trim();
      const statusSpan = document.getElementById('calc-status');
      const btnCalc = document.getElementById('btn-calc');

      if (!urlVal && !htmlVal) {
        alert("Please enter a URL or paste HTML code.");
        return;
      }

      statusSpan.textContent = "⏳ Calculating score...";
      btnCalc.disabled = true;

      try {
        const resp = await fetch('/api/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: urlVal || null,
            html: htmlVal || null,
            exam: document.getElementById('exam-select').value,
            category: document.getElementById('user-category').value,
            zone: document.getElementById('user-zone-state').value,
            gender: document.getElementById('user-gender').value
          })
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || `Server error (${resp.status})`);
        }

        const data = await resp.json();
        document.getElementById('result-container').classList.remove('hidden');
        document.getElementById('res-name').textContent = data.details.name || "Candidate";
        document.getElementById('res-roll').textContent = `Roll/Reg No: ${data.details.roll || "--"}`;
        document.getElementById('res-score').textContent = data.totalScore;
        statusSpan.textContent = "✅ Success!";
      } catch (err) {
        statusSpan.textContent = "⚠️ " + err.message;
        alert(err.message);
      } finally {
        btnCalc.disabled = false;
      }
    }

    function loadDemoGroupD() {
      document.getElementById('sheet-url').value = "https://rrb.digialm.com/per/g06/pub/33128/touchstone/AssessmentQPHTMLMode1/33128O26183/33128O26183S7D97";
      document.getElementById('result-container').classList.remove('hidden');
      document.getElementById('res-name').textContent = "RAJKUMAR DIPAK KANDIKURWAR (Demo)";
      document.getElementById('res-roll').textContent = "Roll/Reg No: 159251303245913";
      document.getElementById('res-score').textContent = "49.34";
    }
  </script>
</body>
</html>
